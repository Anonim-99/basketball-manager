$kind: http-request
method: PUT
url: '{{base_url}}/api/teams/{{team_id}}'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "id": 1,
      "name": "Chicago Bulls Updated",
      "city": "Chicago",
      "coachName": "New Coach"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 204 or 400 or 404", function () {
          pm.expect(pm.response.code).to.be.oneOf([204, 400, 404]);
      });
