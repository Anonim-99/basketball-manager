$kind: http-request
method: GET
url: '{{base_url}}/api/games/{{game_id}}'
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200 or 404", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 404]);
      });
      if (pm.response.code === 200) {
          pm.test("Game has required fields", function () {
              const json = pm.response.json();
              pm.expect(json).to.have.property('id');
              pm.expect(json).to.have.property('homeTeamId');
              pm.expect(json).to.have.property('awayTeamId');
              pm.expect(json).to.have.property('homeScore');
              pm.expect(json).to.have.property('awayScore');
              pm.expect(json).to.have.property('status');
          });
          pm.test("Home and away teams are different", function () {
              const json = pm.response.json();
              pm.expect(json.homeTeamId).to.not.eql(json.awayTeamId);
          });
      }
